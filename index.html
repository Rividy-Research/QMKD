<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diâmetro Cinético – Visualizador 3D</title>

    <!-- Import Map para Three.js e add-ons -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <style>
        /* ---------- Reset e Layout ---------- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fb;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #app {
            display: flex;
            flex: 1;
            height: 100vh;
            overflow: hidden;
        }

        /* ---------- Barra lateral ---------- */
        #sidebar {
            width: 380px;
            min-width: 380px;
            background: #ffffff;
            border-right: 1px solid #d0d7de;
            padding: 24px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 10;
            box-shadow: 2px 0 12px rgba(0, 0, 0, 0.05);
        }
        #sidebar h1 {
            font-size: 20px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #sidebar h1 small {
            font-size: 14px;
            font-weight: 400;
            color: #6b7280;
        }

        .file-area {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .file-area label {
            font-weight: 500;
            font-size: 14px;
            color: #374151;
        }
        .file-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .file-row input[type="file"] {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 13px;
            background: #f9fafb;
            cursor: pointer;
        }
        .file-row input[type="file"]:hover {
            background: #f3f4f6;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-primary {
            background: #2563eb;
            color: #fff;
        }
        .btn-primary:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        .btn-primary:disabled {
            background: #93bbfc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-success {
            background: #16a34a;
            color: #fff;
        }
        .btn-success:hover {
            background: #15803d;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3);
        }
        .btn-success:disabled {
            background: #86d9a3;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-outline {
            background: transparent;
            color: #374151;
            border: 1px solid #d1d5db;
        }
        .btn-outline:hover {
            background: #f3f4f6;
        }
        .btn-danger {
            background: #dc2626;
            color: #fff;
        }
        .btn-danger:hover {
            background: #b91c1c;
        }
        .btn-danger:disabled {
            background: #fca5a5;
            cursor: not-allowed;
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 13px;
        }
        .btn-block {
            width: 100%;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn-group .btn {
            flex: 1;
        }

        /* ---------- Resultados ---------- */
        .result-box {
            background: #f8fafc;
            border-radius: 10px;
            padding: 16px 18px;
            border: 1px solid #e5e7eb;
        }
        .result-box .label {
            font-size: 13px;
            color: #6b7280;
            font-weight: 500;
        }
        .result-box .value {
            font-size: 28px;
            font-weight: 700;
            color: #1e40af;
            margin: 4px 0 2px;
        }
        .result-box .value .unit {
            font-size: 16px;
            font-weight: 400;
            color: #6b7280;
            margin-left: 4px;
        }
        .result-box .detail {
            font-size: 13px;
            color: #374151;
            margin-top: 4px;
        }
        .result-box .detail span {
            background: #e5e7eb;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            margin-right: 6px;
        }

        .status-bar {
            font-size: 13px;
            color: #6b7280;
            padding: 8px 12px;
            background: #f3f4f6;
            border-radius: 6px;
            margin-top: auto;
            min-height: 40px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #e5e7eb;
        }
        .status-bar .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }
        .status-bar .dot.idle {
            background: #9ca3af;
        }
        .status-bar .dot.loading {
            background: #f59e0b;
            animation: pulse 1s infinite;
        }
        .status-bar .dot.success {
            background: #22c55e;
        }
        .status-bar .dot.error {
            background: #ef4444;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        .file-info {
            font-size: 13px;
            color: #6b7280;
            padding: 6px 10px;
            background: #f9fafb;
            border-radius: 4px;
            border: 1px dashed #d1d5db;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ---------- Viewport 3D ---------- */
        #viewport {
            flex: 1;
            height: 100vh;
            background: #ffffff;
            position: relative;
            overflow: hidden;
        }
        #viewport canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        /* Overlay na viewport para info */
        #viewport-overlay {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            color: #fff;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
            text-align: center;
            white-space: nowrap;
        }
        #viewport-overlay.visible {
            opacity: 1;
        }

        /* ---------- Scroll ---------- */
        #sidebar::-webkit-scrollbar {
            width: 4px;
        }
        #sidebar::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 8px;
        }
        #sidebar::-webkit-scrollbar-track {
            background: transparent;
        }

        /* ---------- Responsivo ---------- */
        @media (max-width: 820px) {
            #app {
                flex-direction: column;
            }
            #sidebar {
                width: 100%;
                min-width: unset;
                max-height: 45vh;
                border-right: none;
                border-bottom: 1px solid #d0d7de;
                padding: 16px;
            }
            #viewport {
                height: 55vh;
            }
            .result-box .value {
                font-size: 22px;
            }
        }
        @media (max-width: 480px) {
            #sidebar {
                padding: 12px;
                max-height: 50vh;
            }
            .btn-group {
                flex-direction: column;
            }
            .btn-group .btn {
                flex: unset;
            }
            .file-row {
                flex-direction: column;
                align-items: stretch;
            }
            #viewport-overlay {
                font-size: 12px;
                padding: 6px 16px;
                white-space: normal;
                max-width: 90%;
            }
        }
    </style>
</head>
<body>

    <div id="app">

        <!-- Barra lateral -->
        <div id="sidebar">
            <h1>
                ⚛️ Diâmetro Cinético
                <small>v1.0</small>
            </h1>

            <!-- Upload -->
            <div class="file-area">
                <label for="fileInput">📁 Arquivo <code>vtx.pdb</code></label>
                <div class="file-row">
                    <input type="file" id="fileInput" accept=".pdb" />
                </div>
                <div id="fileInfo" class="file-info">Nenhum arquivo carregado</div>
            </div>

            <!-- Botão Calcular -->
            <button id="calcBtn" class="btn btn-primary btn-block" disabled>
                🔬 Calcular Diâmetro
            </button>

            <!-- Resultados -->
            <div class="result-box">
                <div class="label">📊 Diâmetro cinético</div>
                <div class="value" id="diamValue">— <span class="unit">Å</span></div>
                <div class="detail" id="diamDetail">Aguardando cálculo…</div>
            </div>

            <!-- Ações -->
            <div class="btn-group">
                <button id="vizBtn" class="btn btn-success" disabled>
                    🎯 Visualizar 3D
                </button>
                <button id="saveBtn" class="btn btn-outline" disabled>
                    💾 Salvar .diam
                </button>
                <button id="closeVizBtn" class="btn btn-danger btn-sm" disabled>
                    ✕ Fechar 3D
                </button>
            </div>

            <!-- Status -->
            <div class="status-bar" id="statusBar">
                <span class="dot idle" id="statusDot"></span>
                <span id="statusText">Pronto</span>
            </div>
        </div>

        <!-- Viewport 3D -->
        <div id="viewport">
            <div id="viewport-overlay">🔄 Use o mouse para girar · Scroll para zoom</div>
        </div>

    </div>

    <!-- ======================== MAIN SCRIPT ========================== -->
    <script type="module">
        // ------------------------------------------------------------------
        // Imports
        // ------------------------------------------------------------------
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { ConvexGeometry } from 'three/addons/geometries/ConvexGeometry.js';

        // ------------------------------------------------------------------
        // Constantes
        // ------------------------------------------------------------------
        const CORRECTION_FACTOR = 1.025;

        // ------------------------------------------------------------------
        // DOM refs
        // ------------------------------------------------------------------
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const calcBtn = document.getElementById('calcBtn');
        const diamValue = document.getElementById('diamValue');
        const diamDetail = document.getElementById('diamDetail');
        const vizBtn = document.getElementById('vizBtn');
        const saveBtn = document.getElementById('saveBtn');
        const closeVizBtn = document.getElementById('closeVizBtn');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        const viewport = document.getElementById('viewport');
        const overlay = document.getElementById('viewport-overlay');

        // ------------------------------------------------------------------
        // Estado
        // ------------------------------------------------------------------
        let currentPoints = null; // array de [x,y,z]
        let currentDiameter = null;
        let currentMethod = null;
        let currentHullVertices = null; // array de [x,y,z] (hull)
        let currentHullFaces = null; // array de [i,j,k] (índices)

        let scene = null;
        let camera = null;
        let renderer = null;
        let controls = null;
        let animateId = null;
        let isVizOpen = false;

        // Grupos 3D
        let pointsGroup = null;
        let hullGroup = null;
        let edgeGroup = null;

        // ------------------------------------------------------------------
        // PDB Parser
        // ------------------------------------------------------------------
        function parsePDB(text) {
            const coords = [];
            const lines = text.split('\n');
            for (const line of lines) {
                if (line.startsWith('ATOM') || line.startsWith('HETATM')) {
                    try {
                        const x = parseFloat(line.substring(30, 38).trim());
                        const y = parseFloat(line.substring(38, 46).trim());
                        const z = parseFloat(line.substring(46, 54).trim());
                        if (!isNaN(x) && !isNaN(y) && !isNaN(z)) {
                            coords.push([x, y, z]);
                        }
                    } catch (_) {
                        // fallback: split
                        const parts = line.trim().split(/\s+/);
                        if (parts.length >= 7) {
                            const x = parseFloat(parts[parts.length - 3]);
                            const y = parseFloat(parts[parts.length - 2]);
                            const z = parseFloat(parts[parts.length - 1]);
                            if (!isNaN(x) && !isNaN(y) && !isNaN(z)) {
                                coords.push([x, y, z]);
                            }
                        }
                    }
                }
            }
            return coords;
        }

        // ------------------------------------------------------------------
        // Convex Hull + Largura mínima (fallback bounding box)
        // ------------------------------------------------------------------
        function computeMinWidth(points) {
            if (points.length < 4) {
                return { width: bboxWidth(points), method: 'bounding box (fallback)' };
            }

            // Tenta usar ConvexGeometry do Three.js
            try {
                const vecs = points.map(p => new THREE.Vector3(p[0], p[1], p[2]));
                const geom = new ConvexGeometry(vecs);

                const pos = geom.getAttribute('position');
                const idx = geom.getIndex();

                if (!idx || pos.count < 4) {
                    return { width: bboxWidth(points), method: 'bounding box (fallback)' };
                }

                // Extrai vértices do hull
                const hullVerts = [];
                for (let i = 0; i < pos.count; i++) {
                    hullVerts.push([
                        pos.getX(i),
                        pos.getY(i),
                        pos.getZ(i)
                    ]);
                }

                // Extrai triângulos
                const triangles = [];
                const indices = idx.array;
                for (let i = 0; i < indices.length; i += 3) {
                    triangles.push([indices[i], indices[i + 1], indices[i + 2]]);
                }

                // Calcula largura para cada face
                let minWidth = Infinity;
                for (const tri of triangles) {
                    const p0 = hullVerts[tri[0]];
                    const p1 = hullVerts[tri[1]];
                    const p2 = hullVerts[tri[2]];

                    // normal = (p1-p0) x (p2-p0)
                    const ax = p1[0] - p0[0],
                        ay = p1[1] - p0[1],
                        az = p1[2] - p0[2];
                    const bx = p2[0] - p0[0],
                        by = p2[1] - p0[1],
                        bz = p2[2] - p0[2];
                    let nx = ay * bz - az * by;
                    let ny = az * bx - ax * bz;
                    let nz = ax * by - ay * bx;
                    const len = Math.sqrt(nx * nx + ny * ny + nz * nz);
                    if (len < 1e-12) continue;
                    nx /= len;
                    ny /= len;
                    nz /= len;

                    // projeção de todos os vértices do hull
                    let minProj = Infinity,
                        maxProj = -Infinity;
                    for (const v of hullVerts) {
                        const proj = v[0] * nx + v[1] * ny + v[2] * nz;
                        if (proj < minProj) minProj = proj;
                        if (proj > maxProj) maxProj = proj;
                    }
                    const w = maxProj - minProj;
                    if (w < minWidth) minWidth = w;
                }

                if (!isFinite(minWidth) || minWidth === Infinity) {
                    return { width: bboxWidth(points), method: 'bounding box (fallback)' };
                }

                // Guarda hull para visualização
                currentHullVertices = hullVerts;
                currentHullFaces = triangles;

                return { width: minWidth, method: 'convex hull (Three.js)' };

            } catch (err) {
                console.warn('ConvexGeometry falhou, usando bounding box:', err);
                return { width: bboxWidth(points), method: 'bounding box (fallback)' };
            }
        }

        function bboxWidth(points) {
            let minX = Infinity,
                maxX = -Infinity;
            let minY = Infinity,
                maxY = -Infinity;
            let minZ = Infinity,
                maxZ = -Infinity;
            for (const p of points) {
                if (p[0] < minX) minX = p[0];
                if (p[0] > maxX) maxX = p[0];
                if (p[1] < minY) minY = p[1];
                if (p[1] > maxY) maxY = p[1];
                if (p[2] < minZ) minZ = p[2];
                if (p[2] > maxZ) maxZ = p[2];
            }
            const w = Math.min(maxX - minX, maxY - minY, maxZ - minZ);
            return w;
        }

        // ------------------------------------------------------------------
        // Cálculo completo
        // ------------------------------------------------------------------
        function computeDiameter(points) {
            const { width, method } = computeMinWidth(points);
            const corrected = width / CORRECTION_FACTOR;
            return { diameter: corrected, method, rawWidth: width };
        }

        // ------------------------------------------------------------------
        // Configuração da cena 3D
        // ------------------------------------------------------------------
        function initScene() {
            if (scene) return;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf0f2f5);

            const rect = viewport.getBoundingClientRect();
            const w = rect.width || 800;
            const h = rect.height || 600;

            camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 1000);
            camera.position.set(10, 8, 12);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(w, h);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = false;
            viewport.prepend(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.08;
            controls.autoRotate = false;
            controls.update();

            // Luz
            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambient);
            const dir = new THREE.DirectionalLight(0xffffff, 1.0);
            dir.position.set(10, 20, 10);
            scene.add(dir);
            const dir2 = new THREE.DirectionalLight(0xffffff, 0.4);
            dir2.position.set(-10, -5, -10);
            scene.add(dir2);

            // Grid (opcional, leve)
            const grid = new THREE.GridHelper(20, 20, 0xcccccc, 0xdddddd);
            grid.position.y = -5;
            scene.add(grid);

            // Eixos discretos
            const axes = new THREE.AxesHelper(3);
            axes.position.set(-8, -4, -8);
            scene.add(axes);

            // Grupos para os objetos da molécula
            pointsGroup = new THREE.Group();
            hullGroup = new THREE.Group();
            edgeGroup = new THREE.Group();
            scene.add(pointsGroup);
            scene.add(hullGroup);
            scene.add(edgeGroup);

            // Overlay
            overlay.classList.add('visible');
            setTimeout(() => overlay.classList.remove('visible'), 4000);

            // Resize
            window.addEventListener('resize', onResize);

            // Animação
            animate();
        }

        function onResize() {
            if (!renderer) return;
            const rect = viewport.getBoundingClientRect();
            const w = rect.width || 800;
            const h = rect.height || 600;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }

        function animate() {
            animateId = requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // ------------------------------------------------------------------
        // Atualiza a visualização 3D com os pontos e hull
        // ------------------------------------------------------------------
        function updateVisualization(points, hullVerts, hullFaces, diameter) {
            initScene();

            // Limpa grupos
            while (pointsGroup.children.length) pointsGroup.remove(pointsGroup.children[0]);
            while (hullGroup.children.length) hullGroup.remove(hullGroup.children[0]);
            while (edgeGroup.children.length) edgeGroup.remove(edgeGroup.children[0]);

            // --- Pontos como esferas ---
            const sphereGeom = new THREE.SphereGeometry(0.12, 12, 12);
            const sphereMat = new THREE.MeshStandardMaterial({
                color: 0x1e6f9f,
                roughness: 0.3,
                metalness: 0.1,
                emissive: new THREE.Color(0x1e6f9f),
                emissiveIntensity: 0.15,
            });
            const inst = new THREE.InstancedMesh(sphereGeom, sphereMat, points.length);
            const dummy = new THREE.Object3D();
            for (let i = 0; i < points.length; i++) {
                dummy.position.set(points[i][0], points[i][1], points[i][2]);
                dummy.updateMatrix();
                inst.setMatrixAt(i, dummy.matrix);
            }
            inst.instanceMatrix.needsUpdate = true;
            pointsGroup.add(inst);

            // --- Hull (se disponível) ---
            if (hullVerts && hullFaces && hullFaces.length > 0) {
                // Constrói geometria do hull
                const geom = new THREE.BufferGeometry();
                const verts = [];
                const indices = [];
                for (const v of hullVerts) {
                    verts.push(v[0], v[1], v[2]);
                }
                for (const tri of hullFaces) {
                    indices.push(tri[0], tri[1], tri[2]);
                }
                geom.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
                geom.setIndex(indices);
                geom.computeVertexNormals();

                // Malha semi-transparente
                const mat = new THREE.MeshPhongMaterial({
                    color: 0xcc3333,
                    transparent: true,
                    opacity: 0.12,
                    side: THREE.DoubleSide,
                    roughness: 0.5,
                    metalness: 0.1,
                    depthWrite: false,
                });
                const mesh = new THREE.Mesh(geom, mat);
                hullGroup.add(mesh);

                // Arestas
                const edges = new THREE.EdgesGeometry(geom);
                const edgeMat = new THREE.LineBasicMaterial({
                    color: 0xcc3333,
                    linewidth: 1,
                    transparent: true,
                    opacity: 0.6,
                });
                const line = new THREE.LineSegments(edges, edgeMat);
                edgeGroup.add(line);

                // --- Plano de largura mínima? (opcional: exibir os planos que definem a largura)
                // Não implementado para simplicidade.
            }

            // Ajusta câmera
            if (points.length > 0) {
                const center = new THREE.Vector3();
                for (const p of points) {
                    center.x += p[0];
                    center.y += p[1];
                    center.z += p[2];
                }
                center.divideScalar(points.length);
                controls.target.copy(center);

                // distância automática
                let maxDist = 0;
                for (const p of points) {
                    const d = Math.sqrt(
                        (p[0] - center.x) ** 2 +
                        (p[1] - center.y) ** 2 +
                        (p[2] - center.z) ** 2
                    );
                    if (d > maxDist) maxDist = d;
                }
                const dist = Math.max(maxDist * 2.8, 5);
                camera.position.set(center.x + dist * 0.7, center.y + dist * 0.5, center.z + dist * 0.8);
                controls.update();
            }

            isVizOpen = true;
            closeVizBtn.disabled = false;
            overlay.classList.add('visible');
            setTimeout(() => overlay.classList.remove('visible'), 3000);
        }

        // ------------------------------------------------------------------
        // Fecha visualização
        // ------------------------------------------------------------------
        function closeVisualization() {
            if (animateId) {
                cancelAnimationFrame(animateId);
                animateId = null;
            }
            if (renderer) {
                renderer.dispose();
                if (renderer.domElement && renderer.domElement.parentNode) {
                    renderer.domElement.parentNode.removeChild(renderer.domElement);
                }
                renderer = null;
            }
            if (controls) {
                controls.dispose();
                controls = null;
            }
            scene = null;
            camera = null;
            pointsGroup = null;
            hullGroup = null;
            edgeGroup = null;
            isVizOpen = false;
            closeVizBtn.disabled = true;
            // Remove overlay
            overlay.classList.remove('visible');
            statusText.textContent = 'Visualização fechada';
            statusDot.className = 'dot idle';
        }

        // ------------------------------------------------------------------
        // Salvar arquivo .diam
        // ------------------------------------------------------------------
        function saveDiamFile(points, diameter, method, filename) {
            const baseName = filename.replace(/\.pdb$/i, '') || 'resultado';
            const defaultName = baseName + '.diam';

            // Constrói conteúdo
            const lines = [];
            lines.push(`# Diâmetro cinético calculado a partir de ${filename || 'vtx.pdb'}`);
            lines.push(`# Método: ${method}`);
            lines.push(`# Fator de correção: ${CORRECTION_FACTOR}`);
            lines.push('#');
            lines.push('# O diâmetro cinético foi estimado a partir da superfície de densidade eletrônica');
            lines.push('# (isosuperfície de 0.0015 a.u.), conforme proposto por Mehio et al. (2014).');
            lines.push('# A largura mínima da molécula foi determinada pelo método do convex hull,');
            lines.push('# que encontra a menor distância entre dois planos paralelos que tangenciam');
            lines.push('# a superfície molecular (largura mínima). O valor bruto é então corrigido');
            lines.push(`# pelo fator 1/${CORRECTION_FACTOR} para alinhamento com dados experimentais.`);
            lines.push('#');
            lines.push('# Referência:');
            lines.push('# Mehio, N., Dai, S., & Jiang, D.-e. (2014). Quantum Mechanical Basis for');
            lines.push('# Kinetic Diameters of Small Gaseous Molecules. Journal of Physical Chemistry A,');
            lines.push('# 118(6), 1150–1154. DOI: 10.1021/jp412588f');
            lines.push(`Kinetic Diameter = ${diameter.toFixed(6)} Å`);
            lines.push(`# Número de vértices: ${points.length}`);

            const content = lines.join('\n');

            // Download
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = defaultName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            statusText.textContent = `Arquivo salvo: ${defaultName}`;
            statusDot.className = 'dot success';
        }

        // ------------------------------------------------------------------
        // Handlers principais
        // ------------------------------------------------------------------

        // --- Upload ---
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) {
                fileInfo.textContent = 'Nenhum arquivo carregado';
                calcBtn.disabled = true;
                return;
            }
            fileInfo.textContent = `📄 ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
            calcBtn.disabled = false;
            // Reset resultados
            diamValue.innerHTML = '— <span class="unit">Å</span>';
            diamDetail.textContent = 'Aguardando cálculo…';
            vizBtn.disabled = true;
            saveBtn.disabled = true;
            currentPoints = null;
            currentDiameter = null;
            currentMethod = null;
            currentHullVertices = null;
            currentHullFaces = null;
            statusText.textContent = 'Arquivo carregado, pronto para calcular';
            statusDot.className = 'dot idle';
        });

        // --- Calcular ---
        calcBtn.addEventListener('click', async () => {
            const file = fileInput.files[0];
            if (!file) {
                statusText.textContent = 'Selecione um arquivo PDB primeiro';
                statusDot.className = 'dot error';
                return;
            }

            try {
                statusText.textContent = 'Lendo arquivo…';
                statusDot.className = 'dot loading';
                calcBtn.disabled = true;

                const text = await file.text();
                const coords = parsePDB(text);

                if (coords.length < 3) {
                    throw new Error('Arquivo PDB inválido: poucas coordenadas encontradas.');
                }

                statusText.textContent = `Calculando com ${coords.length} vértices…`;
                statusDot.className = 'dot loading';

                const result = computeDiameter(coords);
                currentPoints = coords;
                currentDiameter = result.diameter;
                currentMethod = result.method;

                // Exibe resultado
                diamValue.innerHTML = `${result.diameter.toFixed(4)} <span class="unit">Å</span>`;
                diamDetail.textContent = `Método: ${result.method}  |  Fator: ${CORRECTION_FACTOR}`;

                vizBtn.disabled = false;
                saveBtn.disabled = false;

                statusText.textContent = `Cálculo concluído: ${result.diameter.toFixed(4)} Å`;
                statusDot.className = 'dot success';

                // Se já havia visualização aberta, atualiza
                if (isVizOpen && currentPoints) {
                    updateVisualization(
                        currentPoints,
                        currentHullVertices,
                        currentHullFaces,
                        currentDiameter
                    );
                }

            } catch (err) {
                statusText.textContent = `Erro: ${err.message}`;
                statusDot.className = 'dot error';
                diamValue.innerHTML = '❌ <span class="unit">erro</span>';
                diamDetail.textContent = err.message;
                vizBtn.disabled = true;
                saveBtn.disabled = true;
                console.error(err);
            } finally {
                calcBtn.disabled = false;
            }
        });

        // --- Visualizar ---
        vizBtn.addEventListener('click', () => {
            if (!currentPoints || currentDiameter === null) {
                statusText.textContent = 'Nenhum resultado para visualizar';
                statusDot.className = 'dot error';
                return;
            }
            updateVisualization(
                currentPoints,
                currentHullVertices,
                currentHullFaces,
                currentDiameter
            );
            statusText.textContent = `Visualização 3D aberta (${currentPoints.length} vértices)`;
            statusDot.className = 'dot success';
        });

        // --- Fechar Visualização ---
        closeVizBtn.addEventListener('click', () => {
            closeVisualization();
        });

        // --- Salvar ---
        saveBtn.addEventListener('click', () => {
            if (currentDiameter === null || !currentPoints) {
                statusText.textContent = 'Nenhum resultado para salvar';
                statusDot.className = 'dot error';
                return;
            }
            const file = fileInput.files[0];
            const fname = file ? file.name : 'vtx.pdb';
            saveDiamFile(currentPoints, currentDiameter, currentMethod, fname);
        });

        // ------------------------------------------------------------------
        // Inicializa cena vazia (opcional: mostra algo interessante)
        // ------------------------------------------------------------------
        // Não inicializa automaticamente para economizar recursos.
        // O usuário precisa carregar um arquivo e clicar em "Visualizar".

        // Se o usuário clicar em visualizar sem nada, mostra uma mensagem
        // mas o botão já está desabilitado.

        // Limpeza ao fechar a página
        window.addEventListener('beforeunload', () => {
            if (animateId) cancelAnimationFrame(animateId);
            if (renderer) renderer.dispose();
        });

        // Drag & drop na viewport para carregar arquivo
        viewport.addEventListener('dragover', (e) => {
            e.preventDefault();
            viewport.style.border = '3px dashed #2563eb';
        });
        viewport.addEventListener('dragleave', () => {
            viewport.style.border = 'none';
        });
        viewport.addEventListener('drop', (e) => {
            e.preventDefault();
            viewport.style.border = 'none';
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                const file = files[0];
                if (file.name.toLowerCase().endsWith('.pdb')) {
                    fileInput.files = files;
                    fileInput.dispatchEvent(new Event('change'));
                    statusText.textContent = 'Arquivo arrastado e carregado!';
                    statusDot.className = 'dot success';
                } else {
                    statusText.textContent = 'Arraste apenas arquivos .pdb';
                    statusDot.className = 'dot error';
                }
            }
        });

        console.log('Diâmetro Cinético - GUI Web carregada.');
        console.log('Fator de correção:', CORRECTION_FACTOR);
    </script>

</body>
</html>
